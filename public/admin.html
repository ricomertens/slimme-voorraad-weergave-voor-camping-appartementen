<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medewerkerbeheer</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/admin.js" defer></script>
</head>
<body class="admin-page">
  <main class="admin-container">
    <header class="admin-header">
      <div>
        <p class="eyebrow">Campingappartementen</p>
        <h1>Voorraadbeheer</h1>
      </div>
      <a href="/" class="text-link">Publieke pagina</a>
    </header>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <section id="login-section" class="panel narrow">
      <h2>Inloggen</h2>
      <form id="login-form">
        <label for="username">Gebruikersnaam</label>
        <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="50">
        <label for="password">Wachtwoord</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
        <button type="submit" class="primary">Inloggen</button>
      </form>
    </section>

    <section id="management-section" hidden>
      <div class="session-bar panel">
        <p>Ingelogd als <strong id="current-user"></strong></p>
        <button id="logout-button" type="button" class="secondary">Uitloggen</button>
      </div>

      <section class="panel">
        <h2>Product toevoegen</h2>
        <form id="add-product-form" class="add-form">
          <div>
            <label for="product-name">Productnaam</label>
            <input id="product-name" name="name" required maxlength="100">
          </div>
          <div>
            <label for="initial-stock">Beginvoorraad</label>
            <input id="initial-stock" name="stock" type="number" required min="0" max="1000000" step="1" value="0">
          </div>
          <button type="submit" class="primary">Toevoegen</button>
        </form>
      </section>

      <section>
        <div class="section-heading">
          <h2>Producten</h2>
          <button id="refresh-button" type="button" class="secondary">Verversen</button>
        </div>
        <div id="admin-product-list" class="admin-products"></div>
      </section>
    </section>
  </main>
</body>
</html>
